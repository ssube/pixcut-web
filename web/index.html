<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174c42" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        if (localStorage.getItem("pixcut-theme") === "pumpkin-spice") {
          document.documentElement.dataset.theme = "pumpkin-spice";
          document.querySelector('meta[name="theme-color"]').content =
            "#a94620";
        }
      } catch {}
    </script>
    <title>PixCut Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
